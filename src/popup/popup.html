<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>抖音氛围光</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="dal-popup">
    <header class="dal-popup-head">
      <img class="dal-popup-logo" src="icons/icon-48.png" alt="" width="34" height="34" />
      <div class="dal-popup-headtext">
        <h1 class="dal-title">抖音氛围光</h1>
        <p class="dal-subtitle" id="dal-popup-status">
          <span class="dal-status-dot" id="dal-popup-dot" aria-hidden="true"></span><span id="dal-popup-status-text">正在读取状态…</span>
        </p>
      </div>
      <button
        class="dal-icon-btn"
        id="dal-popup-info"
        type="button"
        title="诊断信息与全部设置"
        aria-label="诊断信息与全部设置"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 11v5" />
          <path d="M12 7.6h.01" />
        </svg>
      </button>
    </header>

    <!-- Master switch, pulled out of the list the way the reference does. -->
    <section class="dal-master is-on" id="dal-master" data-key="enabled">
      <span class="dal-master-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 2.5v9" />
          <path d="M18.4 6.6a9 9 0 1 1-12.8 0" />
        </svg>
      </span>
      <span class="dal-master-label" id="dal-master-label">开启</span>
      <label class="dal-switch">
        <input type="checkbox" id="dal-master-toggle" />
        <span class="dal-switch-track"><span class="dal-switch-thumb"></span></span>
      </label>
    </section>

    <nav class="dal-tabs" role="tablist" aria-label="设置分组">
      <button class="dal-tab is-active" type="button" role="tab" data-tab="glow" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
        </svg>
        光效
      </button>
      <button class="dal-tab" type="button" role="tab" data-tab="more" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" />
        </svg>
        更多
      </button>
    </nav>

    <div class="dal-panels">
      <div class="dal-panel-card" data-panel="glow" role="tabpanel">
        <div id="dal-popup-glow"></div>
      </div>
      <div class="dal-panel-card" data-panel="more" role="tabpanel" hidden>
        <div id="dal-popup-more"></div>
      </div>
    </div>

    <div class="dal-popup-actions">
      <button class="dal-btn dal-btn--primary" id="dal-open-options" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M4 12H2M22 12h-2M12 4V2M12 22v-2M6.3 6.3L4.9 4.9M19.1 19.1l-1.4-1.4M17.7 6.3l1.4-1.4M4.9 19.1l1.4-1.4" />
        </svg>
        全部设置
      </button>
      <span class="dal-kbd">Alt+Shift+A</span>
    </div>

    <p class="dal-note">
      <span class="dal-note-shield" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
          <path d="M12 3l7 3v6c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z" />
          <path d="M9.4 12.2l1.9 1.9 3.5-3.7" />
        </svg>
      </span>
      <span>画面仅在本机浏览器中用于颜色分析，不上传视频内容。</span>
    </p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
