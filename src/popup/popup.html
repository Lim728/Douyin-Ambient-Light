<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>抖音氛围光</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="dal-popup">
    <header class="dal-header" style="margin-bottom: 12px">
      <div>
        <h1 class="dal-title" style="font-size: 15px">抖音氛围光</h1>
        <p class="dal-subtitle" id="dal-popup-status">正在读取状态…</p>
      </div>
    </header>

    <div class="dal-card">
      <div id="dal-popup-settings"></div>
    </div>

    <div class="dal-popup-actions">
      <button class="dal-btn dal-btn--primary" id="dal-open-options" type="button">全部设置</button>
      <span class="dal-kbd">Alt+Shift+A</span>
    </div>

    <p class="dal-note" style="margin-top: 10px">
      画面仅在本机浏览器中用于颜色分析，不上传视频内容。
    </p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
